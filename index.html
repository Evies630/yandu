<script>
"use strict";
/*APP_JS_BEGIN*/
const $ = id => document.getElementById(id);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const uid = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.style.display='block'; t.textContent=msg; clearTimeout(toast._h); toast._h=setTimeout(()=>t.style.display='none',2600); }
function modal(body){ $('modalBox').innerHTML=body; $('modalMask').classList.add('show'); }
function closeModal(){ $('modalMask').classList.remove('show'); }
$('modalMask').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal(); });
function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

/* ---------- 离线数据层 IndexedDB ---------- */
function openDB(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open('yandu_app',1);
    rq.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('books')) db.createObjectStore('books',{keyPath:'id'});
      if(!db.objectStoreNames.contains('pages')) db.createObjectStore('pages',{keyPath:'id'});
      if(!db.objectStoreNames.contains('materials')) db.createObjectStore('materials',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
    };
    rq.onsuccess=e=>res(e.target.result);
    rq.onerror=e=>rej(e.target.error);
  });
}
let DB=null;
async function dbReady(){ if(!DB) DB=await openDB(); return DB; }
function dbPut(store,val){ return dbReady().then(db=>new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);})); }
function dbGet(store,key){ return dbReady().then(db=>new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const rq=tx.objectStore(store).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);})); }
function dbAll(store){ return dbReady().then(db=>new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const rq=tx.objectStore(store).getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);})); }
function dbDel(store,key){ return dbReady().then(db=>new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);})); }

/* ---------- 设置 ---------- */
let SETTINGS={base:'',key:'',model:'',ocr:'eng'};
async function loadSettings(){ const m=await dbGet('meta','settings'); if(m) Object.assign(SETTINGS,m.val); }
async function saveSettingsToDB(){ await dbPut('meta',{key:'settings',val:SETTINGS}); }
function fillSettingsForm(){ $('sBase').value=SETTINGS.base; $('sKey').value=SETTINGS.key; $('sModel').value=SETTINGS.model; $('sOcr').value=SETTINGS.ocr||'eng'; }
$('saveSettings').addEventListener('click',async()=>{
  SETTINGS.base=$('sBase').value.trim(); SETTINGS.key=$('sKey').value.trim(); SETTINGS.model=$('sModel').value.trim(); SETTINGS.ocr=$('sOcr').value;
  await saveSettingsToDB(); toast('设置已保存');
});
$('testLLM').addEventListener('click',async()=>{
  SETTINGS.base=$('sBase').value.trim(); SETTINGS.key=$('sKey').value.trim(); SETTINGS.model=$('sModel').value.trim(); await saveSettingsToDB();
  $('setupStatus').innerHTML='<div class="hl">正在测试…</div>';
  const r=await llmChat([{role:'user',content:'只回复两个字：连通'}],true);
  $('setupStatus').innerHTML= r.ok?('<div class="hl" style="border-color:var(--brand);background:var(--brand-soft);border-left-color:var(--brand)">✔ 连接成功：'+esc(r.text||'')+'</div>'):('<div class="hl">连接失败：'+esc(r.err)+'</div>');
});

/* ---------- 视图切换 ---------- */
$$('.nav button').forEach(b=>b.addEventListener('click',()=>{
  $$('.nav button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('view-'+b.dataset.view).classList.add('active');
  if(b.dataset.view==='lib') renderBooks();
  if(b.dataset.view==='mats') renderMats();
  if(b.dataset.view==='settings') fillSettingsForm();
}));
/* ---------- AI 大模型客户端（OpenAI 兼容 / Ollama） ---------- */
async function llmChat(messages, silent){
  if(!SETTINGS.base || !SETTINGS.model){ return {ok:false,err:'请先在「设置」中填写 AI 接口地址与模型'}; }
  const url=SETTINGS.base.replace(/\/$/,'')+'/chat/completions';
  const headers={'Content-Type':'application/json'};
  if(SETTINGS.key) headers['Authorization']='Bearer '+SETTINGS.key;
  try{
    const resp=await fetch(url,{method:'POST',headers,body:JSON.stringify({model:SETTINGS.model,messages,temperature:0.3})});
    if(!resp.ok){ const t=await resp.text().catch(()=>''); return {ok:false,err:'HTTP '+resp.status+' '+t.slice(0,140)}; }
    const j=await resp.json();
    const text=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    return {ok:true,text};
  }catch(e){ return {ok:false,err:String((e&&e.message)||e)}; }
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('加载失败 '+src)); document.head.appendChild(s); }); }
let pdfjsReady=null;
function ensurePdfjs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfjsReady) return pdfjsReady;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
  pdfjsReady=loadScript(base+'pdf.min.js').then(()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; });
  return pdfjsReady;
}
let tessReady=null;
function ensureTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessReady) return tessReady;
  tessReady=loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  return tessReady;
}

/* ---------- PDF 解析 & OCR ---------- */
async function parseBook(file){
  await ensurePdfjs();
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const numPages=pdf.numPages;
  const pages=[];
  for(let i=1;i<=numPages;i++){
    const pg=await pdf.getPage(i);
    const tc=await pg.getTextContent();
    pages.push(repairText(tc.items.map(it=>it.str).join(' ')));
  }
  const hasText=pages.some(p=>p.length>40);
  return {numPages,pages,hasText};
}
async function ocrPage(book,pageIdx){ // pageIdx 1-based
  await ensureTesseract();
  const store=await dbGet('pages',book.id);
  const blob=store.blob;
  await ensurePdfjs();
  const arr=await blob.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:arr}).promise;
  const pg=await pdf.getPage(pageIdx);
  const vp=pg.getViewport({scale:1.6});
  const canvas=document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height;
  await pg.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  const lang=SETTINGS.ocrLang||'eng';
  const res=await Tesseract.recognize(canvas,lang,{logger:m=>{ if(m.status==='recognizing text'){ const i=$('ocrInfo'); if(i) i.textContent='OCR 识别第 '+pageIdx+' 页… '+(m.progress*100|0)+'%'; } }});
  const text=repairText((res.data.text||'').replace(/\s+/g,' ').replace(/[ \t]{2,}/g,' ').trim());
  store.pages[pageIdx-1]=text;
  await dbPut('pages',store);
  return text;
}

/* ---------- 文本清理（改善 PDF 提取的单词断行） ---------- */
function repairText(t){
  if(!t) return t;
  let s=String(t);
  s=s.replace(/-[ \t]*\r?\n?[ \t]*(?=[a-zA-Z])/g,''); // “signifi- cant / signifi-\ncant” -> “significant”
  s=s.replace(/\s+([.,;:!?%])/g,'$1');                // 标点前不留空格
  s=s.replace(/[ \t]{2,}/g,' ').trim();
  return s;
}
function splitParas(text){
  if(!text) return [];
  const parts=String(text).split(/(?<=[。！？；！?；…])[\s\n]*/);
  const out=[]; let cur='';
  for(const p of parts){ cur+=' '+p; if(cur.trim().length>=16){ out.push(cur.trim()); cur=''; } }
  if(cur.trim()) out.push(cur.trim());
  return out.filter(x=>x.length);
}

let pdfDocCache=null, pdfCacheBookId=null;
async function getPdfDoc(book){
  if(pdfDocCache && pdfCacheBookId===book.id) return pdfDocCache;
  await ensurePdfjs();
  const store=await dbGet('pages',book.id);
  pdfDocCache=await pdfjsLib.getDocument({data: await store.blob.arrayBuffer()}).promise;
  pdfCacheBookId=book.id;
  return pdfDocCache;
}
const _norm2=s=>(s||'').replace(/\s+/g,'');
function mapQuoteToSpans(spans,quote){
  const q=_norm2(quote); if(!q||!spans.length) return [];
  let cum='';
  const beginBy=[];
  spans.forEach((sp,i)=>{ beginBy[i]=cum.length; cum+=_norm2(sp.textContent); });
  const hit=cum.indexOf(q); if(hit<0) return [];
  const end=hit+q.length, out=[];
  for(let i=0;i<spans.length;i++){
    const s=beginBy[i], e=s+_norm2(spans[i].textContent).length;
    if(e<=hit||s>=end) continue;
    out.push(i);
  }
  return out;
}
async function renderPagePdf(){
  const b=CURRENT.book; const body=$('readingBody');
  const pdf=await getPdfDoc(b);
  const page=await pdf.getPage(CURRENT.page);
  const baseVp=page.getViewport({scale:1});
  const maxW=Math.min(($('reading-card').clientWidth||820)-24,760);
  const scale=Math.max(0.4,Math.min(maxW/baseVp.width,1.7));
  const vp=page.getViewport({scale});
  body.innerHTML='';
  const pageHead=el('<div class="page-head"><span>第 '+CURRENT.page+' 页 · PDF 原文</span><span>'+(b.title||'')+'</span></div>');
  body.appendChild(pageHead);
  const holder=el('<div class="pdfpage" style="position:relative;width:'+vp.width+'px;margin:0 auto;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);background:#fff;overflow:hidden"></div>');
  const canvas=document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height;
  canvas.style.cssText='display:block;width:'+vp.width+'px;height:'+vp.height+'px';
  holder.appendChild(canvas);
  await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  const tld=el('<div class="textLayer" style="position:absolute;left:0;top:0;width:'+vp.width+'px;height:'+vp.height+'px"></div>');
  holder.appendChild(tld);
  const textContent=await page.getTextContent();
  if(textContent && textContent.items && textContent.items.length){
    const textDivs=[];
    const rr=pdfjsLib.renderTextLayer({textContent,viewport:vp,container:tld,textDivs});
    if(rr&&rr.promise){ try{ await rr.promise; }catch(e){ console.warn('textLayer',e); } }
  }
  const spans=Array.prototype.slice.call(tld.querySelectorAll('span'));
  spans.forEach((s,i)=>{ s.dataset.idx=i; });
  // 回显已有高亮
  const hl=(await dbAll('materials')).filter(m=>m.bookId===b.id&&m.page===CURRENT.page&&m.kind==='highlight');
  hl.forEach(m=>{
    let target=(m.spans&&m.spans.length)?m.spans:mapQuoteToSpans(spans,m.quote);
    const cls='hl'+(m.color==='g'?' g':m.color==='b'?' b':'');
    target.forEach(i=>{ const sp=spans[i]; if(sp) sp.classList.add(cls); });
  });
  body.appendChild(holder);
  // 本页批注列在页图下方
  const notes=(await dbAll('materials')).filter(m=>m.bookId===b.id&&m.page===CURRENT.page&&m.kind==='note');
  if(notes.length){
    body.insertAdjacentHTML('beforeend', notes.map(n=>`<div class="note-inline" style="max-width:760px;margin:10px auto 0"><b>我的批注</b>　${esc(n.note||'')}<div style="font-size:12px;color:var(--muted);margin-top:3px">这段 · 第${n.page}页 · <button class="btn sm" data-delmat="${n.id}" style="color:var(--danger);padding:0;background:none;border:none;font-size:12px">删除批注</button></div></div>`).join(''));
  }
  const numPages=b.numPages||pdf.numPages||1;
  body.insertAdjacentHTML('beforeend',`<div class="page-nav" style="max-width:760px;margin:14px auto 0"><button class="btn" ${CURRENT.page<=1?'disabled':''} onclick="gotoPage(${CURRENT.page-1})">← 上一页</button><button class="btn" ${CURRENT.page>=numPages?'disabled':''} onclick="gotoPage(${CURRENT.page+1})">下一页 →</button></div>`);
}

window.ocrBook=async function(){
  if(!CURRENT.book)return;

    }

};
function paraHtml(raw,i,mats){
  let out=raw;
  mats.filter(m=>m.kind==='highlight'&&m.para===i).forEach(m=>{
    const q=m.quote; const idx=out.indexOf(q);
    if(idx>=0){ const cls=(m.color==='g'?' mark g':m.color==='b'?' mark b':' mark'); out=out.slice(0,idx)+'<mark class="'+cls+'">'+out.slice(idx,idx+q.length)+'</mark>'+out.slice(idx+q.length); }
  });
  let html='<p class="para" data-idx="'+i+'">'+esc(out)+'</p>';
  mats.filter(m=>m.kind==='note'&&m.para===i).forEach(m=>{
    html+='<div class="note-inline"><b>我的批注</b>　'+esc(m.note)+
      '<div style="font-size:12px;color:var(--muted);margin-top:3px">'+esc(m.bookTitle)+' · 第'+m.page+'页 · <button class="btn sm" data-delmat="'+m.id+'" style="color:var(--danger);padding:0;background:none;border:none;font-size:12px">删除批注</button></div></div>';
  });
  return html;
}

/* 划选 + 悬浮工具栏（鼠标 & 触屏通用） */
let SEL=null, _selTimer=null;
function closestPara(node){ while(node&&node!==document){ if(node.classList&&node.classList.contains('para')) return node; node=node.parentNode; } return null; }
const _rBody=$('readingBody');
function hideSelBar(){ const b=$('selBar'); b.style.display='none'; }
function boxOf(n){ if(!n) return null; return n.nodeType===1?n:n.parentElement; }
function selectedSpanIdxs(){
  const sel=window.getSelection(); if(!sel||!sel.rangeCount) return [];
  const r=sel.getRangeAt(0); const spans=_rBody.querySelectorAll('.textLayer span'); const out=[];
  for(let i=0;i<spans.length;i++){ if(r.intersectsNode(spans[i])) out.push(i); }
  return out;
}
function maybeShowBar(){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount){ hideSelBar(); return; }
  const aBox=boxOf(sel.anchorNode), fBox=boxOf(sel.focusNode);
  const paraEl=(aBox&&aBox.closest('.para'))||closestPara(sel.anchorNode)||(fBox&&fBox.closest('.para'));
  const inPdf=!!((aBox&&aBox.closest('.pdfpage'))||(fBox&&fBox.closest('.pdfpage')));
  if((!paraEl&&!inPdf)||(!_rBody.contains(paraEl||aBox)&&!inPdf)){ hideSelBar(); return; }
  const q=sel.toString().replace(/\s+/g,' ').trim();
  if(!q||q.length>700){ hideSelBar(); return; }
  if(inPdf){ SEL={quote:q,page:CURRENT.page,spans:selectedSpanIdxs()}; }
  else { SEL={quote:q,page:CURRENT.page,para:paraEl?+paraEl.dataset.idx:0}; }
  const bar=$('selBar'); bar.style.display='flex';
  bar.innerHTML='<button data-a="hl">高亮</button><button data-a="note">批注</button><button data-a="fav">收藏</button><button data-a="tr">翻译</button><button data-a="ask">问 AI</button>';
  const rect=sel.getRangeAt(0).getBoundingClientRect();
  let x=(rect.left+rect.width/2)-(bar.offsetWidth/2);
  let y=rect.top-bar.offsetHeight-10;
  if(x<4)x=4; if(x+bar.offsetWidth>innerWidth-4)x=innerWidth-bar.offsetWidth-4;
  if(y<4)y=rect.bottom+10;
  bar.style.left=x+'px'; bar.style.top=y+'px';
}

  <div class="modal-body">
    <div class="field"><label>原句</label><div class="mono">${esc(quote)}</div></div>
    <div class="field"><label>我的批注 / 联想 / 提问</label><textarea class="txt-in" id="note-body" rows="4" placeholder="写下你的理解…"></textarea></div>
    <div class="field"><label>话题</label><input class="txt-in" id="note-topic" value="未分类" placeholder="输入话题标签"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="note-save">保存批注</button></div>
  </div>`);
  $('note-save').addEventListener('click',async()=>{
    const note=$('note-body').value.trim(); if(!note){ toast('请填写批注内容'); return; }
    const topic=$('note-topic').value.trim()||'未分类';
    await addMaterial({kind:'note',note:note,quote:SEL&&SEL.quote||quote,para:SEL?SEL.para:null,topic:topic});
    closeModal(); await renderPage(); toast('批注已保存');
  });
}
$('readingBody').addEventListener('click',async e=>{
  const b=e.target.closest('[data-delmat]'); if(!b)return;
  if(confirm('删除该批注？')){ await dbDel('materials',b.dataset.delmat); await renderPage(); }
});
/* ---------- 翻译 ---------- */
function openTranslateModal(quote){
  modal(`<div class="modal-head">翻译<button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="field"><label>原句</label><div class="mono">${esc(quote)}</div></div>
    <div class="field"><label>目标语言</label>
      <select class="dd" id="x-tgt"><option>中文</option><option>英文</option><option>日语</option><option>法语</option><option>德语</option></select></div>
    <button class="btn primary" id="x-go">开始翻译（需已配置 AI）</button>
    <div id="x-status" style="font-size:12.5px;color:var(--muted);margin:8px 0"></div>
    <div class="mono" id="x-out" style="min-height:40px"></div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="x-save">存为素材（附译文）</button>
      <button class="btn primary" id="x-cite" disabled>生成此句引文</button></div>
  </div>`);
  window._xData=null;
  $('x-go').addEventListener('click',async()=>{
    const tgt=$('x-tgt').value; $('x-status').textContent='翻译中…';
    const r=await llmChat([{role:'system',content:'你是严谨的学术翻译助手，只输出译文本身，不要解释、不要加引号。'},
      {role:'user',content:'请把下面文本翻译成'+tgt+'：\n'+quote}]);
    if(!r.ok){ $('x-status').textContent=r.err; return; }
    $('x-out').textContent=r.text; $('x-status').textContent='';
    window._xData={quote,text:r.text,tgt}; $('x-cite').disabled=false;
  });
  $('x-save').addEventListener('click',async()=>{
    if(!window._xData){ toast('请先翻译'); return; }
    await addMaterial({kind:'translation',quote:window._xData.quote,note:'【译文·'+window._xData.tgt+'】'+window._xData.text,srcLang:'auto',tgtLang:window._xData.tgt});
    toast('译文已存入素材库'); closeModal();
  });
  $('x-cite').addEventListener('click',()=>{ openCiteMaterialMatch(queueQuote(SEL&&SEL.quote||quote)); });
}
function queueQuote(quote){ return {quote}; }

/* ---------- AI 答疑 + 本地找句 ---------- */
function openAskModal(quote){
  modal(`<div class="modal-head">AI 阅读助手<button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="field"><label>所选原句</label><div class="mono">${esc(quote)}</div></div>
    <div class="field"><label>问题 / 指令</label><input class="txt-in" id="ask-q" value="" placeholder="例如：这句话如何理解？它的论证结构是怎样的？"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn primary" id="ask-go">AI 答疑（需 AI）</button>
      <button class="btn" id="ask-find">在素材库里找相关句子（本地）</button>
    </div>
    <div id="ask-out" style="font-size:14px"></div>
    <div id="ask-list" style="margin-top:10px"></div>
  </div>`);
  $('ask-go').addEventListener('click',async()=>{
    const q=$('ask-q').value.trim()||'请结合原句给出客观解读，并提示哪些要点可用于学术引用（不要虚构文献出处）';
    $('ask-out').innerHTML='<div class="hl">AI 思考中…</div>';
    const r=await llmChat([{role:'system',content:'你是学术研究助理。回答须准确、克制，只围绕给出的原句展开；凡涉及他人观点或文献，一律不虚构来源，宁可说明“库外信息，请自行核实”。'},
      {role:'user',content:'原文出自《'+CURRENT.book.title+'》第'+CURRENT.page+'页：\n「'+quote+'」\n\n问题：'+q}]);
    $('ask-out').innerHTML= r.ok? ('<div style="background:var(--surface3);border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-word">'+esc(r.text)+'</div>') : ('<div class="hl">'+esc(r.err)+'</div>');
  });
  $('ask-find').addEventListener('click',async()=>{
    const kw=$('ask-q').value.trim(); if(!kw){ toast('请先输入想找的关键词'); return; }
    const list=await dbAll('materials');
    const hit=list.filter(m=>m.kind!=='highlight'&&((m.quote&&m.quote.indexOf(kw)>=0)||(m.note&&m.note.indexOf(kw)>=0)));
    $('ask-list').innerHTML=hit.length? '<b style="font-size:13px">本地命中共 '+hit.length+' 条：</b>'+hit.map(m=>
      `<div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px">
        <div style="font-style:italic;color:var(--ink)">”${esc(m.quote)}“</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(m.bookTitle)} · 第${m.page}页</div>
      </div>`).join('')
      : '<div class="hl">素材库中没有找到包含“'+esc(kw)+'”的内容。</div>';
  });
}

/* ---------- 素材库 ---------- */
let MATS_BOOK=null;
async function getTopics(){ const t=await dbGet('meta','topics'); return (t&&t.val)||['未分类']; }
async function saveTopics(list){ await dbPut('meta',{key:'topics',val:list}); }
$('addTopic').addEventListener('click',async()=>{
  const name=prompt('新话题名称：');
  if(!name||!name.trim())return;
  const t=await getTopics(); if(t.indexOf(name.trim())<0){ t.push(name.trim()); await saveTopics(t); }
  await renderMats();
});
$('matsSearch').addEventListener('input',()=>renderMats());
$('topicFilter').addEventListener('change',()=>renderMats());
$('readerJumpMats').addEventListener('click',()=>{ MATS_BOOK=CURRENT.book?CURRENT.book.id:null; switchView('mats'); renderMats(); });
function switchView(name){
  $$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===name));
  $$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));
}
async function renderMats(){
  const topics=await getTopics();
  const cur=$('topicFilter').value||'全部';
  const opts=['<option value="全部">所有话题</option>'].concat(topics.map(t=>{
    const label= MATS_BOOK&& t==='未分类'? t+'（本书）':t;
    return `<option value="${esc(t)}" ${cur===t?'selected':''}>${esc(label)}</option>`;
  }));
  $('topicFilter').innerHTML=opts;
  let list=await dbAll('materials');
  list.sort((a,b)=>b.createdAt-a.createdAt);
  if(MATS_BOOK) list=list.filter(m=>m.bookId===MATS_BOOK);
  const kw=$('matsSearch').value.trim();
  if(kw) list=list.filter(m=>(m.quote&&m.quote.toLowerCase().indexOf(kw.toLowerCase())>=0)||(m.note&&m.note.toLowerCase().indexOf(kw.toLowerCase())>=0));
  if(cur!=='全部') list=list.filter(m=>m.topic===cur);
  const box=$('matsList');
  if(!list.length){ box.innerHTML='<div class="empty" style="grid-column:1/-1">'+(MATS_BOOK?'本书还没有素材，去阅读并划句收藏吧':'还没有素材，去书库打开一本书划句收藏')+'</div>'; return; }
  box.innerHTML=list.map(m=>{
    const isTrans=m.kind==='translation';
    const quote=m.quote||'';
    const note=(m.note||'').replace(/^【译文[^】]*】/,'');
    const showNote= m.kind==='note'?m.note:(isTrans?note:'');
    return `<div class="mat" data-id="${m.id}">
      <div class="quote">${isTrans?'🌐 ':''}“${esc(quote)}”</div>
      ${showNote?`<div class="note">${esc(showNote)}</div>`:''}
      <div class="src">
        <span>${esc(m.bookTitle||'')} · ${m.page?('第'+m.page+'页'):''}</span>
        <select class="dd" data-topicof="${m.id}" style="padding:3px 6px;font-size:12px;max-width:120px">
          ${topics.map(t=>`<option ${m.topic===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
      </div>
      <div class="acts">
        <button class="btn sm" data-copy="${m.id}">复制原文</button>
        <button class="btn sm primary" data-citem="${m.id}">生成引文</button>
        <button class="btn sm danger" data-delmat2="${m.id}">删除</button>
      </div>
    </div>`;
  }).join('');
}
$('matsList').addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b)return;
  const id=b.dataset.copy||b.dataset.citem||b.dataset.delmat2;
  const m=await dbGet('materials',id); if(!m)return;
  if(b.dataset.copy){ await copyText(m.quote||m.note||''); toast('原文已复制'); }
  else if(b.dataset.citem){ openCiteSingle(m); }
  else if(b.dataset.delmat2){ if(confirm('删除该素材？')){ await dbDel('materials',id); await renderMats(); } }
});
$('matsList').addEventListener('change',async e=>{
  if(e.target.dataset.topicof){ const m=await dbGet('materials',e.target.dataset.topicof); if(m){ m.topic=e.target.value; await dbPut('materials',m); renderMats(); } }
});
async function copyText(t){ try{ await navigator.clipboard.writeText(t); }catch(e){ prompt('复制（手动）：',t); } }
/* ---------- 引文 / 参考文献（离线生成） ---------- */
function citeParts(m){
  return {author:m.author||'佚名', title:m.bookTitle||m.title||'未命名',
    city:(m.city||'').trim(), pub:(m.publisher||'').trim(), year:(m.year||'').trim(), page:m.page!=null?String(m.page):''};
}
function citeReference(m,style){
  const p=citeParts(m);
  if(style==='apa') return p.author+' ('+p.year+'). '+p.title+'. '+p.pub+'.';
  if(style==='mla') return p.author+'. '+p.title+'. '+[p.pub,p.year].filter(Boolean).join(', ')+'.';
  if(style==='chicago') return p.author+'. '+p.title+'. '+[p.city,p.pub].filter(Boolean).join(': ')+', '+p.year+'.';
  let body=p.author+'. '+p.title+'[M]';
  if(p.city&&p.pub) body+='. '+p.city+': '+p.pub;
  else if(p.pub) body+='. '+p.pub;
  if(p.year) body+=', '+p.year;
  return body+'.';
}
function citeFootnote(m,style){
  const p=citeParts(m); const pg=p.page?('第'+p.page+'页'):'';
  if(style==='apa') return p.author+' ('+p.year+'), '+p.title+(pg?', '+pg:'')+'.';
  if(style==='mla') return p.author+'. '+p.title+'. '+[p.pub,p.year].filter(Boolean).join(', ')+(pg?', '+p.page+'.':'.');
  if(style==='chicago') return p.author+', '+p.title+' ('+[p.city,p.pub].filter(Boolean).join(': ')+', '+p.year+')'+(pg?', '+pg:'.')+'.';
  let body=p.author+'. '+p.title+'[M]';
  if(p.city&&p.pub) body+='. '+p.city+': '+p.pub;
  else if(p.pub) body+='. '+p.pub;
  if(p.year) body+=', '+p.year;
  if(pg) body+=': '+pg;
  return body+'.';
}
function refKey(m){ return (m.bookTitle||'')+'|'+(m.year||'')+'|'+(m.publisher||''); }
function openCiteSingle(m){
  modal(`<div class="modal-head">生成引文<button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="field"><label>原句</label><div class="mono">${esc(m.quote||'')}</div></div>
    <div class="field"><label>引用格式</label><select class="dd" id="c1-style"><option value="gb">GB/T 7714（国标）</option><option value="apa">APA 7th</option><option value="mla">MLA 9th</option><option value="chicago">Chicago</option></select></div>
    <div class="field"><label>脚注（按当前格式已生成）</label><div class="mono" id="c1-foot"></div></div>
    <div class="field"><label>参考文献条目</label><div class="mono" id="c1-ref"></div></div>
    <div class="field hint">提示：在书库「编辑信息」补齐作者/年份/出版社后，格式将更完整。</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="c1-copy">复制全部</button><button class="btn primary" onclick="closeModal()">完成</button></div>
  </div>`);
  const render=()=>{ const s=$('c1-style').value; $('c1-foot').textContent=citeFootnote(m,s); $('c1-ref').textContent=citeReference(m,s); };
  $('c1-style').addEventListener('change',render); render();
  $('c1-copy').addEventListener('click',()=>{ const s=$('c1-style').value; copyText('脚注：'+citeFootnote(m,s)+'\n参考文献：'+citeReference(m,s)); toast('已复制'); });
}
function openCiteMaterialMatch(m){
  const mm={quote:m.quote||'', author:m.author||CURRENT.book.author||'', bookTitle:m.bookTitle||(CURRENT.book&&CURRENT.book.title)||'',
    year:m.year||(CURRENT.book&&CURRENT.book.year)||'', publisher:m.publisher||(CURRENT.book&&CURRENT.book.publisher)||'',
    city:m.city||(CURRENT.book&&CURRENT.book.city)||'', page:(m.page!=null?m.page:(CURRENT?CURRENT.page:''))};
  openCiteSingle(mm);
}
$('genCite').addEventListener('click',async()=>{
  let list=await dbAll('materials'); list.sort((a,b)=>b.createdAt-a.createdAt);
  if(MATS_BOOK) list=list.filter(m=>m.bookId===MATS_BOOK);
  list=list.filter(m=>m.kind!=='highlight');
  if(!list.length){ toast(MATS_BOOK?'本书暂无可用素材':'还没有可引用的素材'); return; }
  modal(`<div class="modal-head">生成引文与参考文献<button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="field"><label>引用格式</label><select class="dd" id="c2-style"><option value="gb">GB/T 7714（国标）</option><option value="apa">APA 7th</option><option value="mla">MLA 9th</option><option value="chicago">Chicago</option></select></div>
    <div class="field"><label>选择要引用的素材（可多选）</label>
      <div id="c2-list" style="max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px">
        ${list.map(m=>`<label style="display:block;padding:5px;font-size:13.5px"><input type="checkbox" data-c2="${m.id}"> ${esc((m.bookTitle||'')+(m.page?' p.'+m.page:''))} — “${esc((m.quote||'').slice(0,32))}”</label>`).join('')}
      </div></div>
    <button class="btn primary" id="c2-go">生成</button>
    <div id="c2-out" style="margin-top:12px"></div>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="c2-copy">复制结果</button><button class="btn" onclick="closeModal()">完成</button></div>
  </div>`);
  $('c2-go').addEventListener('click',async()=>{
    const ids=$$('#c2-list input:checked').map(c=>c.dataset.c2);
    if(!ids.length){ toast('请至少选择一条素材'); return; }
    const all=await dbAll('materials'); const sel=all.filter(m=>ids.indexOf(m.id)>=0);
    const s=$('c2-style').value; const refs={};
    const foot=sel.map((m,i)=>(i+1)+'. '+citeFootnote(m,s)).join('\n');
    sel.forEach(m=>{ const k=refKey(m); if(!refs[k])refs[k]=citeReference(m,s); });
    const refLine=Object.keys(refs).map(k=>refs[k]).join('\n');
    $('c2-out').innerHTML='<b>脚注</b><div class="mono">'+esc(foot)+'</div><div style="margin-top:10px"><b>参考文献</b><div class="mono">'+esc(refLine)+'</div></div>';
    window._cite2={foot,ref:refLine};
  });
  $('c2-copy').addEventListener('click',()=>{ if(window._cite2){ copyText('脚注：\n'+window._cite2.foot+'\n\n参考文献：\n'+window._cite2.ref); toast('已复制'); } });
});

/* ---------- 启动 ---------- */
(async function init(){
  try{ await dbReady(); }catch(e){ console.error(e); }
  await loadSettings().catch(()=>{});
  fillSettingsForm();
  await renderBooks();
})();
