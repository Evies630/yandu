<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研读 · 学术阅读与素材库</title>
<style>
:root{
  --bg:#F4F6F4; --bg2:#EAF0EC; --surface:#FFFFFF; --surface2:#F1F6F3; --surface3:#E4EEE9;
  --ink:#17211D; --ink2:#31453D; --muted:#6C8379; --line:#DDE7E1;
  --brand:#0E8C68; --brand2:#0A7054; --brand-soft:#E3F3EC; --brand-text:#0A5B47;
  --yellow:#F9E9B4; --green:#D8EFE1; --blue:#D9EAFF;
  --warn:#B26A00; --warn-bg:#FBF1DC; --danger:#C1444B;
  --radius:14px; --radius-s:10px;
  --shadow:0 1px 2px rgba(18,52,40,.05),0 6px 20px -8px rgba(18,52,40,.12);
  --shadow-lg:0 2px 4px rgba(18,52,40,.06),0 18px 40px -16px rgba(18,52,40,.28);
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --font-serif:"Georgia","Songti SC","Noto Serif CJK SC","STSong",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2) 300px);font-size:15px;line-height:1.72;min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
::selection{background:rgba(14,140,104,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:8px 15px;border-radius:var(--radius-s);font-size:14px;font-weight:500;transition:all .15s ease;box-shadow:0 1px 1px rgba(18,52,40,.03)}
.btn:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 4px 12px -4px rgba(14,140,104,.5)}
.btn.primary:hover{box-shadow:0 6px 16px -4px rgba(14,140,104,.6);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft);color:var(--brand);transform:none}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface3);color:var(--brand-text);font-weight:500}
.tag.y{background:var(--yellow);color:#7a5b00}
.tag.b{background:var(--blue);color:#1c4d8f}
.tag.g{background:var(--green);color:#0d5c3a}

/* Layout */
#topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--brand);margin-right:16px;letter-spacing:.2px}
.brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 3px 8px -2px rgba(14,140,104,.5)}
.nav{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.nav button{background:transparent;border:none;padding:7px 16px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:500;transition:all .15s}
.nav button:hover{color:var(--brand)}
.nav button.active{background:var(--surface);color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(18,52,40,.12)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;z-index:200;display:none;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#modalMask{position:fixed;inset:0;background:rgba(18,40,34,.52);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
#modalMask.show{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(680px,96vw);max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);font-weight:700;z-index:2}
.modal-body{padding:20px 22px}
.modal-x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.modal-x:hover{color:var(--danger)}

/* Views */
main{padding:18px 20px 60px}
.view{display:none;max-width:1020px;margin:0 auto}
.view.active{display:block;animation:fv .22s ease}
@keyframes fv{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-title{font-size:22px;font-weight:800;margin-bottom:4px;letter-spacing:.2px}
.view-sub{color:var(--muted);font-size:14px;margin-bottom:20px}

/* Library */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:16px;padding:46px 24px;background:linear-gradient(180deg,var(--surface),var(--surface2));color:var(--muted);text-align:center;cursor:pointer;transition:all .18s}
.drop:hover{border-color:var(--brand);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.drop.on{border-color:var(--brand);background:var(--brand-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:16px;margin-top:18px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:all .18s;box-shadow:var(--shadow)}
.book:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.book .cov{height:102px;border-radius:10px;background:linear-gradient(135deg,var(--brand-soft),var(--surface3));display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--brand);position:relative;overflow:hidden}
.book .cov .initial{font-size:34px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(14,120,90,.35);font-family:var(--font-serif)}
.book .cov .bgico{position:absolute;right:10px;bottom:-6px;font-size:56px;opacity:.16;transform:rotate(-8deg)}
.book .cov.c0{background:linear-gradient(135deg,#0E8C68,#1FBF87)}
.book .cov.c1{background:linear-gradient(135deg,#2D6CDF,#5A9CFF)}
.book .cov.c2{background:linear-gradient(135deg,#B26A00,#E8A23A)}
.book .cov.c3{background:linear-gradient(135deg,#8A4FC0,#C89EFF)}
.book .cov.c4{background:linear-gradient(135deg,#C1444B,#E8787E)}
.book .cov.c5{background:linear-gradient(135deg,#31523F,#5F8A72)}
.book .t{font-weight:600;margin-top:10px;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;margin-top:5px}
.book .stat{font-size:12px;margin-top:9px;color:var(--muted)}
.book .stat .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.book .stat .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:3px;transition:width .3s}

/* Reader */
.reader-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.reader-bar .rtitle{font-weight:700;flex:1;min-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-ctrl{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.page-jump{width:58px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface2);font-size:13px}
#reading-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px clamp(18px,4.5vw,48px);min-height:60vh;max-width:760px;margin:0 auto;box-shadow:var(--shadow)}
.page-head{color:var(--muted);font-size:12.5px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
.page-head .page-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
#reading-card{--fs:18px;--ff:"Songti SC","Noto Serif CJK SC","STSong","SimSun","Georgia",serif}
.para{font-family:var(--ff,"Songti SC","Noto Serif CJK SC","STSong","SimSun","Georgia",serif);font-size:var(--fs,18px);line-height:2.12;margin:0 0 1.45em 0;color:#2c2c2c;text-align:justify;text-justify:inter-ideograph;word-spacing:.02em;letter-spacing:.015em;overflow-wrap:break-word;user-select:text;-webkit-user-select:text;text-rendering:optimizeLegibility}
.para a{color:var(--brand);text-decoration:none}
.para.selected{background:rgba(14,140,104,.12);box-shadow:0 0 0 6px rgba(14,140,104,.12);border-radius:6px}
/* 排版阅读字号/字体控制 */
.rs-ctrl{display:flex;align-items:center;gap:6px}
.rbtn{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:9px;font-size:14px;font-weight:700;line-height:1;transition:all .15s}
.rbtn:hover{border-color:var(--brand);color:var(--brand)}
.rbtn:disabled{opacity:.4;cursor:not-allowed}
.rs-f{font-size:13px;padding:5px 8px;border-radius:9px;max-width:132px}
/* PDF 原文视图：画布 + 文字层 */
.textLayer{position:absolute;left:0;top:0;line-height:1;text-align:initial;overflow:hidden}
.textLayer span{position:absolute;white-space:pre;cursor:text;transform-origin:0 0;color:transparent}
.textLayer ::selection{background:rgba(24,122,255,.34)}
.mode-switch{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:3px}
.mode-switch button{border:none;background:transparent;padding:6px 13px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:500}
.mode-switch button.on{background:var(--surface);color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(18,52,40,.12)}
.reader-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.reader-tools.on{border-top:1px solid var(--line);padding-top:12px}
#selBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:70;display:none;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:rgba(23,33,29,.96);color:#fff;border-radius:16px;padding:9px 12px;box-shadow:0 12px 32px rgba(0,0,0,.35);max-width:95vw}
#selBar .sq{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:rgba(255,255,255,.82)}
#selBar button{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:13.5px;padding:9px 12px;border-radius:9px;white-space:nowrap}
#selBar button:hover,#selBar button:active{background:rgba(255,255,255,.32)}
#selBar button.x{background:transparent;padding:6px 8px;color:rgba(255,255,255,.6);font-size:15px}
/* ===== 微信读书式选取：逐字单元 / 拖动手柄 / 放大镜 ===== */
.para .u{display:inline;cursor:text}
.para .u.sup{vertical-align:super;font-size:.66em;color:var(--brand);font-weight:600;letter-spacing:0}
.textLayer span.sup{background:rgba(14,140,104,.20);border-radius:2px;box-shadow:0 0 0 1px rgba(14,140,104,.12)}
#readingBody .u.sel,#readingBody .ow.sel{background:rgba(14,140,104,.24);border-radius:2px;box-shadow:0 0 0 1px rgba(14,140,104,.14)}
#selH0,#selH1{position:fixed;width:22px;height:22px;margin-left:-11px;margin-top:-11px;z-index:81;visibility:hidden;cursor:grab;touch-action:none;pointer-events:auto}
#selH0::before,#selH1::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#0E8C68;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.28)}
#selH0::after,#selH1::after{content:"";position:absolute;left:50%;top:50%;width:2px;height:26px;background:rgba(14,140,104,.55);transform:translate(-50%,-50%)}
#selMag{position:fixed;z-index:82;pointer-events:none;display:none;font-size:21px;color:#222;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:8px;padding:6px 10px;box-shadow:0 10px 26px rgba(0,0,0,.28);line-height:1;white-space:nowrap}
#selMag::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff}
.page-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.note-inline{background:var(--brand-soft);border-left:3px solid var(--brand);border-radius:8px;padding:9px 13px;margin:6px 0 12px;font-size:14px;color:var(--ink2)}
.note-inline b{color:var(--brand-text)}

/* 目录 */
.toc-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s;color:var(--ink2)}
.toc-item:hover{background:var(--surface2);color:var(--brand)}
.toc-item .num{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.toc-item .arr{color:var(--muted);font-size:12px;width:14px;flex:0 0 auto}

/* Materials */
.mats-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.mats-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.mat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.mat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mat .quote{font-size:14px;color:var(--ink);font-family:var(--font-serif);border-left:3px solid var(--brand);padding-left:11px;margin-bottom:9px;line-height:1.75}
.mat .note{font-size:13.5px;color:var(--ink2);margin-bottom:9px}
.mat .src{font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:9px;display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line)}
.mat .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.topic-chip{cursor:pointer}
select.dd{border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 11px;background:var(--surface)}
select.dd:focus,input.txt-in:focus,textarea.txt-in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input.txt-in{border:1px solid var(--line);border-radius:var(--radius-s);padding:9px 13px;background:var(--surface);width:100%;transition:border-color .15s}
textarea.txt-in{border:1px solid var(--line);border-radius:var(--radius-s);padding:9px 13px;background:var(--surface);width:100%;resize:vertical;transition:border-color .15s}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
.hl{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:8px;padding:11px 15px;margin:14px 0;font-size:14px}
.mono{font-family:var(--mono);font-size:13px;background:var(--surface2);padding:9px 13px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.spin{width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
.btn .spin{border-color:var(--brand);border-top-color:transparent}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:46px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink2);margin-bottom:6px}
.progress-line{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress-line>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}
mark{background:var(--yellow);border-radius:3px;padding:0 2px}
/* 阅读进度条（置于阅读卡片顶部） */
.rd-progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:18px}
.rd-progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:2px;transition:width .35s ease}
/* 目录弹窗 */
.toc-search{width:100%;margin-bottom:10px}
.toc-tree{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.toc-head{position:sticky;top:0;background:var(--surface);font-size:12px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.toc-head .cur{font-weight:600;color:var(--brand)}
.toc-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:background .12s;color:var(--ink2);border-bottom:1px solid var(--surface3)}
.toc-item:last-child{border-bottom:none}
.toc-item:hover{background:var(--brand-soft);color:var(--brand)}
.toc-item.on{background:var(--brand-soft)}
.toc-item.on .toc-title{color:var(--brand);font-weight:600}
.toc-item .chip{font-size:11px;color:var(--muted);flex:0 0 auto}
.toc-item .toc-title{flex:1;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-item .pg{font-size:12px;color:var(--brand-text);background:var(--surface3);border-radius:6px;padding:1px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.toc-empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8}
/* 细滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfdad4;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
/* 阅读卡片顶部有一抹主题色 */
#reading-card{position:relative}
#reading-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,var(--brand),var(--brand2))}
/* ===== 精致化微调 ===== */
.brand .logo{box-shadow:0 4px 14px -3px rgba(14,140,104,.6)}
.nav button.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px -4px rgba(14,140,104,.65)}
.nav button.active:hover{color:#fff}
.book .cov{transition:transform .22s ease}
.book:hover .cov{transform:scale(1.03) rotate(-.4deg)}
.book .cov::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 95% at 22% 0,rgba(255,255,255,.3),transparent 56%)}
.reader-bar{border-radius:18px;gap:12px}
#selBar{border:1px solid rgba(255,255,255,.16)}
#selBar button{box-shadow:0 1px 3px rgba(0,0,0,.22)}
.modal{border:1px solid var(--line)}
.mat{border-radius:18px}
.drop{position:relative}
.drop::before{content:"";position:absolute;inset:0;border-radius:16px;background:radial-gradient(85% 85% at 50% 0,rgba(14,140,104,.06),transparent 68%);pointer-events:none}
.view-sub{line-height:1.7}
input.page-jump:focus{outline:none;border-color:var(--brand)}
/* 阅读区更安静的底色，突出正文 */
main#readerBg{background:linear-gradient(180deg,#F6F7F6,var(--bg2) 260px)}
#view-reader .reader-bar{backdrop-filter:blur(8px);background:rgba(255,255,255,.9)}
@media(max-width:640px){.book-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="topbar">
  <div class="brand"><div class="logo">研</div>研读</div>
  <div class="nav">
    <button data-view="lib" class="active">书库</button>
    <button data-view="reader">阅读</button>
    <button data-view="mats">素材库</button>
    <button data-view="settings">设置</button>
  </div>
</div>
<main>
  <!-- 书库 -->
  <section id="view-lib" class="view active">
    <div class="view-title">书库</div>
    <div class="view-sub">上传 PDF 书籍，自动解析文本；扫描版可在阅读时逐页 OCR。</div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
    <label for="fileInput" class="drop" id="drop" role="button" style="cursor:pointer;">
      <div style="font-size:34px;line-height:1">📄</div>
      <div style="font-weight:700;font-size:16px;color:var(--brand)">上传 PDF 书籍</div>
      <span class="btn primary" style="pointer-events:none;">选择 PDF 文件</span>
      <div style="font-size:12.5px">拖拽到此处也可（支持多本）</div>
      <div style="font-size:12px;color:var(--muted)">文本 PDF 自动提取 · 扫描版可在阅读时逐页 OCR</div>

/* ---------- PDF 解析 & OCR ---------- */
/* ===== 上标注释编号识别（行簇感知，改善版）=====
   目的：把“注释/引用编号”（①②③、上标小数字 1 2 3…）与“年代大数字 / 页码小字 /
   脚注行首编号 / 下标”区分开。判据四条线索：
   ① 行内字号：先按基线 y 把本页字符聚成若干“视觉行”，取每行主流字号(中位数)；
   ② 该字字号显著小于所在行主流字号( <0.74×H )；
   ③ 纵向抬高：该字基线明显高于所在行主流基线( 距离 ≥ max(2,0.28×H) )，
      —— 真上标底部不回落到基线，从而把下标、脚注行首编号、页码小字排除；
   ④ 内容形态：为短标注符号（1~3位数字 / ①② / 单字母 / (1) / [1] / * 弹 † ‖ 等），
      并显式排除“4位纯数字年份(19xx/20xx)”与大于 3 位的年代。 */
const SUP_FORM=/^(?:[0-9]{1,3}|[a-zA-Z]|[①-⑳]|[ⓐ-ⓩ]|[（(][0-9a-zA-Z]{1,3}[)）]|\[[0-9a-zA-Z]{1,3}\]|[*＋†‖¶❀])$/;
/* 数学/希腊字母规避：这些字符即便字号小、位置抬高，也属于数学上下标或文本符号，绝非脚注注释编号 */
const MATH_STYLE=/[\u00B2\u00B3\u00B9\u2070-\u2079\u207A\u207B\u207F\u2080-\u2089\u208A\u208B\u208E]/; // ²³¹⁰-⁹ ⁺⁻ ⁿ ₀-₉ ₊ ₌
const GREEK=/[\u0370-\u03FF\u1F00-\u1FFF]/; // 希腊字母及扩展：αβγ… μ σ χ Δ …
/* 单个变量字母（拉丁或希腊），用作幂/指数的底，例如 x² 中的 x */
const VAR_LETTER=/^(?:[a-zA-Z]|[\u0370-\u03FF\u1F00-\u1FFF])$/;
/* 左邻：同一行内紧邻其左的非空字符是否为单个变量字母 → 若是则更像数学指数(如 x²)而非注释编号 */
const _leftVar=(row,o)=>{
  const s=row.items.slice(0).sort((a,b)=>a.x-b.x);
  const idx=s.indexOf(o);
  for(let i=idx-1;i>=0;i--){ const ts=String(s[i].it.str||'').trim(); if(!ts) continue; return VAR_LETTER.test(ts); }
  return false;
};
const _med=a=>{const s=a.slice().sort((x,y)=>x-y);return s[Math.floor(s.length/2)]||0;};
function supAnalysis(items){
  const seq=[];
  (items||[]).forEach(it=>{
    const tr=it.transform||[1,0,0,1,0,0];
    const h=Math.hypot(tr[2],tr[3])||it.height||0;
    if(h<3) return;
    seq.push({it,h,y:(tr[5]||0),x:(tr[4]||0)});
  });
  // 聚行：按基线 y 排序后，基线相近(容差随字号增长)的归为同一视觉行
  const rows=[];
  if(seq.length){
    seq.sort((a,b)=>a.y-b.y);
    let cur=null;
    for(const o of seq){
      if(!cur || o.y-cur.medY>cur.tol){
        cur={items:[o],medY:o.y,h:o.h,tol:Math.max(3,o.h*0.6)}; rows.push(cur);
      }else{
        cur.items.push(o); cur.h=Math.max(cur.h,o.h);
        const ys=cur.items.map(x=>x.y);
        cur.medY=ys[Math.floor(ys.length/2)];
        cur.tol=Math.max(3,cur.h*0.6);
      }
    }
  }
  const sups=[], supObjs=new Set();
  for(const r of rows){
    if(r.items.length<2) continue;               // 独行不成组，跳过
    r.items.sort((a,b)=>a.x-b.x);                // 按 x 排，便于判断“指数左邻”
    const H=_med(r.items.map(x=>x.h))||1;        // 该行主流字号
    const Y=_med(r.items.map(x=>x.y));           // 该行主流基线
    for(const o of r.items){
      const raw=String(o.it.str||''); const str=raw.trim();
      if(!str) continue;
      const h=o.h;
      if(h>=H*0.74) continue;                    // ① 与主流同大 → 非上标
      if(Y-o.y < Math.max(2,H*0.28)) continue;   // ③ 未明显上抬 → 下标/脚注行首编号/页码小字
      if(/^[0-9]{4}$/.test(str)) continue;       // ④ 4 位年份显式排除
      if(MATH_STYLE.test(raw)) continue;         // 数学上下标(²³⁰⁻ⁿ₀₉…)，非注释编号
      if(GREEK.test(raw)) continue;              // 希腊字母(αβμσχ…)，非注释编号
      if(str.length>4 || !SUP_FORM.test(str)) continue; // ④ 短标注形态
      if(_leftVar(r,o)) continue;                // 左邻是单变量字母 → 更像 x² 指数，非注释
      sups.push(str); supObjs.add(o.it);
    }
  }
  return {sups, supObjs, med:_med(seq.map(x=>x.h))||16};
}
/* detectSups：返回本页被识别为“上标注释编号”的字符串集合，供排版视图按命中加视觉上标 */
function detectSups(items){ return supAnalysis(items).sups; }
async function parseBook(file){
  await ensurePdfjs();
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const numPages=pdf.numPages;
  const pages=[], sups=[];
  for(let i=1;i<=numPages;i++){
    const pg=await pdf.getPage(i);
    const tc=await pg.getTextContent();
    pages.push(repairText(tc.items.map(it=>it.str).join(' ')));
    sups.push(detectSups(tc.items));
  }
  const withText=pages.filter(p=>p.length>60).length;
  const hasText=numPages===0?false:(withText/numPages>=0.4);
  return {numPages,pages,hasText,sups};
}
async function ocrPage(book,pageIdx){ // pageIdx 1-based
  await ensureTesseract();
  const store=await dbGet('pages',book.id);
  const blob=store.blob;
  await ensurePdfjs();
  const arr=await blob.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:arr}).promise;
  const pg=await pdf.getPage(pageIdx);
  const vp=pg.getViewport({scale:1.6});
  const canvas=document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height;
  await pg.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  const lang=await pickOcrLang(canvas);
  const res=await Tesseract.recognize(canvas,lang,{logger:m=>{ if(m.status==='recognizing text'){ const i=$('ocrInfo'); if(i) i.textContent='OCR 识别第 '+pageIdx+' 页（'+lang+'）… '+(m.progress*100|0)+'%'; } }});
  const text=repairText((res.data.text||'').replace(/\s+/g,' ').replace(/[ \t]{2,}/g,' ').trim());
  const cw=canvas.width||1, ch=canvas.height||1;
  const words=(res.data.words||[]).map(w=>({t:String(w.text||'').trim(),x:((w.bbox&&w.bbox.x0)||0)/cw,y:((w.bbox&&w.bbox.y0)||0)/ch,w:(((w.bbox&&w.bbox.x1)||0)-((w.bbox&&w.bbox.x0)||0))/cw,h:(((w.bbox&&w.bbox.y1)||0)-((w.bbox&&w.bbox.y0)||0))/ch})).filter(v=>v.t);
  store.pages[pageIdx-1]=text;
  store.words=store.words||[]; store.words[pageIdx-1]=words;
  await dbPut('pages',store);
  await dbDel('corpus',book.id);
  return text;
}
/* 选择 OCR 语言：用户显式指定则用之；未指定或“自动”则先用 detect 猜语种，猜不到回退到中英混合 */
async function pickOcrLang(canvas){
  const pref=SETTINGS.ocr||'';
  if(pref && pref!=='auto') return pref;
  try{
    const d=await Tesseract.detect(canvas);
    const scr=((d&&d.data&&(d.data.script||d.data.scriptName))||(d&&d.script)||'').toLowerCase();
    if(scr.indexOf('Han'.toLowerCase())>=0 || scr.indexOf('cjk')>=0 || scr.indexOf('chi')>=0) return 'chi_sim+eng';
    if(scr.indexOf('latin')>=0 || scr.indexOf('eng')>=0) return 'eng';
  }catch(e){}
  return 'chi_sim+eng';
}

async function handleFiles(files){
  for(const f of files){
    const b={id:uid(),title:f.name.replace(/\.pdf$/i,''),author:'',translator:'',publisher:'',year:'',edition:'',city:'',kind:'parsing',numPages:0,createdAt:Date.now(),status:'解析中…'};
    await dbPut('books',b);
    await dbPut('pages',{id:b.id,blob:f,pages:[]});
    renderBooks();
    try{
      const r=await parseBook(f);
      b.numPages=r.numPages; b.pagesCount=r.numPages;
      b.kind=r.hasText?'text':'scan';
      const store={id:b.id,blob:f,pages:r.pages,sup:r.sups||[]};
      await dbPut('pages',store);
      // 自动识别书籍元信息（作者/译者/出版社/年份等），仅填空缺项
      if(!b.author || !b.publisher || !b.year){ const mi=inferBookMeta(r.pages,b.title); if(!b.author&&mi.author)b.author=mi.author; if(!b.translator&&mi.translator)b.translator=mi.translator; if(!b.publisher&&mi.publisher)b.publisher=mi.publisher; if(!b.city&&mi.city)b.city=mi.city; if(!b.year&&mi.year)b.year=mi.year; if(!b.edition&&mi.edition)b.edition=mi.edition; }
      b.status='ready';
      toast('已导入「'+b.title+'」 · '+b.numPages+' 页 · '+(r.hasText?'文本文档':'扫描版（可逐页 OCR）'));
    }catch(err){
      b.status='error'; console.error(err);
      toast('导入失败：'+((err&&err.message)||err));
    }
    await dbPut('books',b);
    renderBooks();
  }
}

function hashCls(s){ let h=0; s=String(s||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return 'c'+(h%6); }
async function renderBooks(){

/* ---------- 文本清理（改善 PDF 提取的单词断行） ---------- */
function repairText(t){
  if(!t) return t;
  let s=String(t);
  s=s.replace(/-[ \t]*\r?\n?[ \t]*(?=[a-zA-Z])/g,''); // “signifi- cant / signifi-\ncant” -> “significant”
  s=s.replace(/\s+([.,;:!?%])/g,'$1');                // 标点前不留空格
  s=s.replace(/[ \t]{2,}/g,' ').trim();
  return s;
}
function splitParas(text){
  if(!text) return [];
  const out=[]; let paraIdx=0;
  // 先按空行切出“逻辑段落”，再在段内按句切块显示
  const lps=String(text).split(/\n\s*\n/);
  for(const lp of lps){
    const parts=String(lp).split(/(?<=[。！？；！?；…])[\s\n]*/);
    let cur='';
    for(const p of parts){ cur+=' '+p; if(cur.trim().length>=16){ out.push({text:cur.trim(),para:paraIdx}); cur=''; } }
    if(cur.trim()) out.push({text:cur.trim(),para:paraIdx});
    paraIdx++;
  }
  return out.filter(x=>x.text.length);
}

async function getOutlineTree(book){
  const have=(await dbAll('books')).find(x=>x.id===book.id)||book;
  if(have && Array.isArray(have.toc) && have.toc.length) return have.toc;
  let items=[];
  try{
    const pdf=await getPdfDoc(book);
    const outline=await pdf.getOutline();
    if(outline && outline.length){
      async function walk(list,depth){
        for(const it of list){
          let pg=null;
          try{
            const d=it.dest;
            if(Array.isArray(d)&&d[0]) pg=await pdf.getPageIndex(d[0])+1;
            else if(typeof d==='string'){ const dd=await pdf.getDestination(d); if(dd&&dd[0]) pg=await pdf.getPageIndex(dd[0])+1; }
          }catch(e){}
          if(pg==null && it.pageNumber) pg=it.pageNumber;
          if(pg!=null) items.push({title:String(it.title||'').trim()||'（无标题）',page:pg,depth});
          if(it.items&&it.items.length) await walk(it.items,depth+1);
        }
      }
      await walk(outline,0);
    }
  }catch(e){ console.warn('outline',e); }
  if(!items.length){
    // 文本书启发式扫描目录页
    const store=await dbGet('pages',book.id);
    const arr=(store&&store.pages)||[];
    try{
      for(let i=0;i<Math.min(arr.length, Math.ceil(arr.length*0.25)+4);i++){
        const page=arr[i]||'';
        if(!/目录|contents/i.test(page)) continue;
        const lines=page.split(/\n/);
        const found=[];
        for(const ln of lines){
          const m=ln.match(/^\s*(?:第\s*[一二三四五六七八九十百\d]+\s*[章回节]\s*[:：、.．]?\s*|(?:Chapter|CHAPTER|Part)\s+\d+[.．:：]?\s*)(.+?)[.。\s]+(\d{1,4})\s*$/);
          if(m){ const pg0=parseInt(m[2],10); found.push({title:m[1].trim(),page:pg0,depth:0}); }
        }
        if(found.length){ items=found; break; }
      }
    }catch(e){}
  }
  if(items && items.length && !Array.isArray(have.toc)){ have.toc=items; await dbPut('books',have); }
  return items;
}

let pdfDocCache=null, pdfCacheBookId=null;
async function getPdfDoc(book){
  if(pdfDocCache && pdfCacheBookId===book.id) return pdfDocCache;
  await ensurePdfjs();
  const store=await dbGet('pages',book.id);
  pdfDocCache=await pdfjsLib.getDocument({data: await store.blob.arrayBuffer()}).promise;
  pdfCacheBookId=book.id;
  return pdfDocCache;
}
const _norm2=s=>(s||'').replace(/\s+/g,'');
function mapQuoteToSpans(spans,quote){
  const q=_norm2(quote); if(!q||!spans.length) return [];
  let cum='';
  const beginBy=[];
  spans.forEach((sp,i)=>{ beginBy[i]=cum.length; cum+=_norm2(sp.textContent); });
  const hit=cum.indexOf(q); if(hit<0) return [];
  const end=hit+q.length, out=[];
  for(let i=0;i<spans.length;i++){
    const s=beginBy[i], e=s+_norm2(spans[i].textContent).length;
    if(e<=hit||s>=end) continue;
    out.push(i);
  }
  return out;
}

  void ocrPrompt;

function _splitTokens(str){
  const out=[];
  const re=/([\u4e00-\u9fff\uff00-\uffef]{1,})|([A-Za-z0-9]+(?:['’\-.][A-Za-z0-9]+)*)|([^\s\u4e00-\u9fffA-Za-z0-9]+)/g;
  let m; while((m=re.exec(str))){ const g=m[0]; if(/^[\u4e00-\u9fff\uff00-\uffef]+$/.test(g)){ for(const ch of g) out.push(ch); } else out.push(g); }
  if(!out.length && str) out.push(str);
  return out;
}

/* 精准文字层：按词/单字拆成独立 span，点击/拖动可精确选取，不再一选一整行 */
async function buildWordLayer(holder,textContent,vp,W,H){
  const tld=el('<div class="textLayer" style="position:absolute;left:0;top:0;width:'+W+'px;height:'+H+'px"></div>');
  holder.appendChild(tld);
  const out=[];
  const items=textContent.items||[];
  // 行簇感知：识别真正的上标注释编号（抬高+小字+标注形态），排除年代/页码/脚注行首编号/下标
  const {supObjs}=supAnalysis(items);
  for(const it of items){
    const str=String(it.str||''); if(!str) continue;
    const tr=it.transform||[1,0,0,1,0,0];
    const x0=tr[4], yTop=tr[5];
    const fh=Math.max(4, Math.hypot(tr[2],tr[3])||(it.height||16));
    const isSup=supObjs.has(it)&&SUP_FORM.test(str.trim());
    const tokens=_splitTokens(str);
    const ws=tokens.map(t=>_tokW(t,fh));
    const total=ws.reduce((a,b)=>a+b,0)||1;
    const totalW=(it.width>0)?it.width:total;
    const k=totalW/total;
    let x=x0;
    tokens.forEach((tk,i)=>{
      if(!tk.trim()){ x+= ws[i]*k; return; }
      const w=Math.max(1, ws[i]*k);
      const sp=document.createElement('span');
      sp.className='ow'+(isSup?' sup':'');
      sp.dataset.oi=out.length;
      sp.textContent=tk;
      sp.style.cssText='left:'+x+'px;top:'+yTop+'px;width:'+w+'px;height:'+fh+'px;font-size:'+fh+'px;line-height:'+fh+'px;';
      x+=w;
      tld.appendChild(sp); out.push(sp);
      if(isSup){ sp.dataset.sup='1'; }
    });
  }
  return out;
}
function buildOcrOverlay(holder,words,W,H){
  const tld=el('<div class="textLayer" style="position:absolute;left:0;top:0;width:'+W+'px;height:'+H+'px"></div>');
  holder.appendChild(tld);
  words.forEach((w,i)=>{

    const sp=document.createElement('span');

function wrapUnits(text,supSet){
  // 中文逐字、英文按词包成 <span class="u">；上标注释编号(<supSet 命中>)额外加 .sup 视觉上标，与年代大数字区分
  let html='';
  const re=/([\u4e00-\u9fff\uff00-\uffef]+)|([A-Za-z0-9]+(?:['’\-.][A-Za-z0-9]+)*)|(\s+)|([^\s\u4e00-\u9fffA-Za-z0-9]+)/g;
  let m; while((m=re.exec(text))){
    const g=m[0];
    const suped = supSet && supSet.has(g) && !/^\s+$/.test(g) && !/^[0-9]{4}$/.test(g) && SUP_FORM.test(g) && !MATH_STYLE.test(g) && !GREEK.test(g);
    const cls='u'+(suped?' sup':'');
    if(/^[\u4e00-\u9fff\uff00-\uffef]+$/.test(g)){ for(const ch of g) html+='<span class="u">'+ch+'</span>'; }
    else if(/^[A-Za-z0-9]/.test(g)){ html+='<span class="'+cls+'">'+g+'</span>'; }
    else if(/^\s+$/.test(g)){ html+='<span class="u">'+g+'</span>'; }
    else { html+='<span class="'+cls+'">'+esc(g)+'</span>'; }
  }
  return html;
}
function paraHtml(raw,i,para,mats,supSet){

    const group=[].slice.call(_rBody.querySelectorAll('.para')).filter(p=>p.dataset.para===target);
    if(!group.length) return;
    const firstU=group[0].querySelector('.u');
    const lastU=[].slice.call(group[group.length-1].querySelectorAll('.u')).pop();
    const ia=uIdxOf(firstU), ib=uIdxOf(lastU);
    if(ia>=0&&ib>=0) applyTouch(ia,ib);
    return;
  }
  // 句：在选中的显示块内扩到整句边界
  const ps=new Set();
  [UNITS[TV.a].el,UNITS[TV.b].el].forEach(el=>{ const p=el.closest('.para'); if(p) ps.add(p); });
  if(!ps.size){ return; }
  let na=Infinity, nb=-1;
  ps.forEach(p=>{
    const us=[].slice.call(p.querySelectorAll('.u'));
    if(!us.length) return;
    const text=us.map(u=>u.textContent).join('');
    const ca=charOff(us,UNITS[TV.a].el), cb=charOff(us,UNITS[TV.b].el);
    if(ca<0||cb<0) return;
    let sa=sentenceStart(text,ca), sb=sentenceEnd(text,cb);
    const aU=charToUnit(us,sa), bU=charToUnit(us,sb);
    const ia=uIdxOf(aU), ib=uIdxOf(bU);
    if(ia>=0&&ia<na)na=ia; if(ib>=nb)nb=ib;
  });
  if(na!==Infinity && nb>=na){ applyTouch(na,nb); }
}
function charOff(us,el){ let off=0; for(const u of us){ if(u===el) return off; off+=u.textContent.length; } return -1; }
function charToUnit(us,ci){ let cum=0,last=us[0]; for(const u of us){ if(ci<cum+u.textContent.length) return u; cum+=u.textContent.length; last=u; } return last; }
function sentenceStart(t,i){ for(let k=i-1;k>=0;k--){ if(/[。！？；…：·、\n]/.test(t[k])) return k+1; } return 0; }
function sentenceEnd(t,i){ for(let k=i;k<t.length;k++){ if(/[。！？…：\n]/.test(t[k])) return Math.min(k+1,t.length); } return t.length; }

const STOP=new Set(('的 了 和 与 在 是 我 你 他 她 它 这 那 中 于 之 有 也 就 都 而 及 为 被 把 但 此外 如果 不 要 给 等 或 并且 a an the is are was were be to of and for in on at by with from as it its this that we they he she not or but if can will would could should may might have has had do does did what how why which where when one two about').split(' '));
function tokenize(str){
  const s=String(str||'').toLowerCase();
  const spaced=s.replace(/[\u4e00-\u9fff]/g,c=>' '+c+' ');
  return spaced.split(/[^a-z0-9\u4e00-\u9fff]+/).filter(t=>t&&!STOP.has(t));
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
async function getCorpusPages(bookId){
  const st=await dbGet('corpus',bookId);
  if(st&&Array.isArray(st.pages)) return st.pages;
  const p=await dbGet('pages',bookId);
  const arr=(p&&p.pages)||[];
  await dbPut('corpus',{id:bookId,pages:arr});
  return arr;
}
async function localFind(q){
  const terms=tokenize(q); if(!terms.length) terms=[q.toLowerCase()].filter(Boolean);
  const books=await dbAll('books');
  const scored=[];
  for(const b of books){
    const pages=await getCorpusPages(b.id); if(!pages) continue;
    for(let i=0;i<pages.length;i++){
      const text=pages[i]||''; if(!text) continue;
      const low=text.toLowerCase(); let score=0;
      terms.forEach(t=>{ const re=new RegExp(escRe(t),'g'); const mm=low.match(re); if(mm) score+=((t.length>4?3:2)*mm.length); });
      if(score>0) scored.push({bookId:b.id,title:b.title||'未命名',page:i+1,text,score});
    }
  }
  scored.sort((x,y)=>y.score-x.score);
  return scored.slice(0,60);
}
function snippet(text,terms){
  const low=text.toLowerCase(); let idx=-1;
  terms.forEach(t=>{ const i=low.indexOf(t.toLowerCase()); if(i>=0&&(idx<0||i<idx)) idx=i; });
  if(idx<0) idx=0;
  const s=Math.max(0,idx-50), e=Math.min(text.length,idx+150);
  return (s>0?'…':'')+text.slice(s,e)+(e<text.length?'…':'');
}
function hlText(raw){
  let s=esc(raw);
  const el=document.getElementById('af-q'); const terms=tokenize(el?el.value:'');
  terms.slice(0,12).forEach(t=>{ const re=new RegExp(escRe(t),'gi'); s=s.replace(re,m=>'<mark>'+m+'</mark>'); });
  return s;
}
function renderLocalHits(hits){
  if(!hits.length) return '<div style="color:var(--muted)">未找到相关内容。</div>';
  return hits.slice(0,15).map(h=>{
    const terms=tokenize(document.getElementById('af-q')?document.getElementById('af-q').value:'');
    const sn=snippet(h.text,terms.length?terms:[h.text.slice(0,6)]);
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">

      <div class="mono" style="font-size:13px;white-space:pre-wrap;word-break:break-word">${hlText(sn)}</div>

  }).join('');
}

/* ---------- 书籍元信息自动识别（版权页启发式 + 可选 AI 增强） ---------- */
const PUBCITIES=['北京','上海','天津','广州','深圳','南京','武汉','杭州','成都','重庆','西安','济南','长春','沈阳','郑州','长沙','哈尔滨','福州','合肥','南昌','南宁','昆明','贵阳','海口','兰州','银川','西宁','乌鲁木齐','呼和浩特','石家庄','太原','香港','台北','澳门','桂林','苏州','青岛','大连','厦门'];
function inferBookMeta(pages,title){
  const head=((Array.isArray(pages)?pages:[]).filter(t=>t&&t.trim()).slice(0,8)).map(t=>t.replace(/\s+/g,' ')).join('\n');
  const meta={author:'',translator:'',publisher:'',year:'',edition:'',city:''};
  if(!head && title){ meta.year=((String(title).match(/(19\d\d|20\d\d)/)||[])[0]||''); return meta; }
  meta.year=((head.match(/(?:©|copyright|C\))?\s?(19\d\d|20\d\d)/i)||[])[1]||(String(title).match(/(19\d\d|20\d\d)/)||[])[0]||'');
  const pm=head.match(/([\u4e00-\u9fffA-Za-z0-9（）()·&]{2,16}?出版社(?:有限责任公司|股份有限公司)?)/);
  if(pm){
    const str=pm[0];
    meta.publisher=str.replace(/有限责任公司|股份有限公司/,'');
    const c=PUBCITIES.find(city=>str.indexOf(city)>=0);
    if(c) meta.city=c;
  }
  if(!meta.city){ const c=PUBCITIES.find(city=>head.indexOf(city)>=0); if(c) meta.city=c; }
  const aM=head.match(/([（(\[\【]?[A-Za-z]?[\u4e00-\u9fff·]{2,10}[）)\]】]?)\s?(?:编著|主编|著|编)(?=[，,。．.：:（(]|$)/);
  if(aM) meta.author=aM[1].replace(/[（(\[\【）)\]】]/g,'').trim();
  if(!meta.author){ const a2=head.match(/[（(\[\【]?[A-Za-z]?[\u4e00-\u9fff·]{2,8}[）)\]】]?\s?等?著(?=[，,。．.：:]|$)/); if(a2) meta.author=a2[0].replace(/\s?著/,'').replace(/[（(\[\【）)\]】]/g,'').trim(); }
  const tM=head.match(/([（(\[\【]?[A-Za-z]?[\u4e00-\u9fff·]{1,10}[）)\]】]?)\s?(?:译著|翻译|译)(?=[，,。．.：:（(]|$)/);
  if(tM) meta.translator=tM[1].replace(/[（(\[\【）)\]】]/g,'').trim();
  const eM=head.match(/[第]\s*([一二三四五六七八九十\d]+)\s*[版][本]?/);
  if(eM) meta.edition='第'+eM[1]+'版';
  return meta;
}

function citeParts(m){
  return {author:(m.author||'').trim()||'佚名', translator:(m.translator||'').trim(),
    title:(m.bookTitle||m.title||'未命名'),
    city:(m.city||'').trim(), pub:(m.publisher||'').trim(), year:(m.year||'').trim(),
    edition:(m.edition||'').trim(), page:m.page!=null?String(m.page):''};
}
function citeReference(m,style){
  const p=citeParts(m);
  const auth=p.translator? (p.author+' 著，'+p.translator+' 译') : p.author;
  const place=(p.city&&p.pub)?p.city+': '+p.pub:(p.pub||'');
  if(style==='apa') return p.author+' ('+(p.year||'n.d.')+'). '+p.title+'. '+(p.pub||'');
  if(style==='mla') return p.author+'. '+p.title+(p.pub?'. '+p.pub:'')+(p.year?', '+p.year+'':'.'); 
  if(style==='chicago') return auth+', '+p.title+' ('+place+', '+p.year+').';
  if(style==='phil'){ let s=auth+'：《'+p.title+'》'; if(place) s+='，'+place; if(p.year) s+='，'+p.year; return s+'。'; }
  // gb / whu（武大本科论文采用国标 GB/T 7714 图书类著录）
  let s=auth+'. '+p.title+'[M]';
  if(place) s+='. '+place;
  if(p.year) s+=', '+p.year;
  return s+'.';
}
function citeFootnote(m,style){
  const p=citeParts(m);
  const auth=p.translator? (p.author+' 著，'+p.translator+' 译') : p.author;
  const place=(p.city&&p.pub)?p.city+': '+p.pub:(p.pub||'');
  const pg=p.page?('第'+p.page+'页'):'';
  if(style==='apa') return p.author+' ('+(p.year||'n.d.')+'), '+p.title+(pg?', '+pg:'')+'.';
  if(style==='mla') return p.author+'. '+p.title+'. '+(p.year||'');
  if(style==='chicago') return auth+', '+p.title+' ('+place+', '+p.year+')'+(pg?', '+pg:'')+'.';
  if(style==='phil'){ let s=auth+'：《'+p.title+'》'; if(place) s+='，'+place; if(p.year) s+='，'+p.year; if(pg) s+='，'+pg; return s+'。'; }
  // gb / whu 脚注
  let s=auth+'. '+p.title+'[M]';
  if(place) s+='. '+place;
  if(p.year) s+=', '+p.year;
  if(pg) s+=': '+pg;
  return s+'.';
}
function refKey(m){ return (m.bookTitle||'')+'|'+(m.year||'')+'|'+(m.publisher||'')+'|'+(m.translator||''); }
function openCiteSingle(m){
  modal(`<div class="modal-head">生成引文<button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="field"><label>原句</label><div class="mono">${esc(m.quote||'')}</div></div>
    <div class="field"><label>引用格式</label><select class="dd" id="c1-style"><option value="whu">武汉大学本科毕业论文（GB/T 7714）</option><option value="phil">《哲学研究》期刊格式</option><option value="gb">GB/T 7714（国标）</option><option value="apa">APA 7th</option><option value="mla">MLA 9th</option><option value="chicago">Chicago</option></select></div>
    <div class="field"><label>脚注（按当前格式已生成）</label><div class="mono" id="c1-foot"></div></div>
    <div class="field"><label>参考文献条目</label><div class="mono" id="c1-ref"></div></div>
    <div class="field hint">提示：在书库「编辑信息」补齐作者/年份/出版社后，格式将更完整。</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="c1-copy">复制全部</button><button class="btn primary" onclick="closeModal()">完成</button></div>
  </div>`);
  const render=()=>{ const s=$('c1-style').value; $('c1-foot').textContent=citeFootnote(m,s); $('c1-ref').textContent=citeReference(m,s); };
  $('c1-style').addEventListener('change',render); render();
  $('c1-copy').addEventListener('click',()=>{ const s=$('c1-style').value; copyText('脚注：'+citeFootnote(m,s)+'\n参考文献：'+citeReference(m,s)); toast('已复制'); });
}
function openCiteMaterialMatch(m){
  const b=CURRENT.book||{};
  const mm={quote:m.quote||'', author:m.author||b.author||'', translator:m.translator||b.translator||'', edition:m.edition||b.edition||'',
    bookTitle:m.bookTitle||b.title||'',
    year:m.year||b.year||'', publisher:m.publisher||b.publisher||'',
    city:m.city||b.city||'', page:(m.page!=null?m.page:(CURRENT?CURRENT.page:''))};
  openCiteSingle(mm);
}
$('genCite').addEventListener('click',async()=>{
  let list=await dbAll('materials'); list.sort((a,b)=>b.createdAt-a.createdAt);
  if(MATS_BOOK) list=list.filter(m=>m.bookId===MATS_BOOK);
  list=list.filter(m=>m.kind!=='highlight');
  if(!list.length){ toast(MATS_BOOK?'本书暂无可用素材':'还没有可引用的素材'); return; }
  modal(`<div class="modal-head">生成引文与参考文献<button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="field"><label>引用格式</label><select class="dd" id="c2-style"><option value="whu">武汉大学本科毕业论文（GB/T 7714）</option><option value="phil">《哲学研究》期刊格式</option><option value="gb">GB/T 7714（国标）</option><option value="apa">APA 7th</option><option value="mla">MLA 9th</option><option value="chicago">Chicago</option></select></div>
    <div class="field"><label>选择要引用的素材（可多选）</label>
      <div id="c2-list" style="max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px">
        ${list.map(m=>`<label style="display:block;padding:5px;font-size:13.5px"><input type="checkbox" data-c2="${m.id}"> ${esc((m.bookTitle||'')+(m.page?' p.'+m.page:''))} — “${esc((m.quote||'').slice(0,32))}”</label>`).join('')}
      </div></div>
    <button class="btn primary" id="c2-go">生成</button>
    <div id="c2-out" style="margin-top:12px"></div>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="c2-copy">复制结果</button><button class="btn" onclick="closeModal()">完成</button></div>
  </div>`);
  $('c2-go').addEventListener('click',async()=>{
    const ids=$$('#c2-list input:checked').map(c=>c.dataset.c2);
    if(!ids.length){ toast('请至少选择一条素材'); return; }
    const all=await dbAll('materials'); const sel=all.filter(m=>ids.indexOf(m.id)>=0);
    const s=$('c2-style').value; const refs={};
    const foot=sel.map((m,i)=>(i+1)+'. '+citeFootnote(m,s)).join('\n');
    sel.forEach(m=>{ const k=refKey(m); if(!refs[k])refs[k]=citeReference(m,s); });
    const refLine=Object.keys(refs).map(k=>refs[k]).join('\n');
    $('c2-out').innerHTML='<b>脚注</b><div class="mono">'+esc(foot)+'</div><div style="margin-top:10px"><b>参考文献</b><div class="mono">'+esc(refLine)+'</div></div>';
    window._cite2={foot,ref:refLine};
  });
  $('c2-copy').addEventListener('click',()=>{ if(window._cite2){ copyText('脚注：\n'+window._cite2.foot+'\n\n参考文献：\n'+window._cite2.ref); toast('已复制'); } });
});

/* ---------- 启动 ---------- */
(async function init(){
  try{ await dbReady(); }catch(e){ console.error(e); }
  await loadSettings().catch(()=>{});
  fillSettingsForm();
  await loadRstyle().catch(()=>{});
  applyRstyle();
  await renderBooks();
})();
/*APP_JS_END*/
</script>
